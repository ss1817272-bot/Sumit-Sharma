name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build APK
        run: |
          unzip -o GyanWalaJaduiSafarAndroid_Project.zip -d project
          PROJECT_DIR=$(find project -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project files not found"
            exit 1
          fi
          cd "$(dirname "$PROJECT_DIR")"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Gyan-Wala-Jadui-Safar-APK
          path: project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
